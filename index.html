<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Best Phone Deal</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="icon-hero-tick" viewBox="0 0 13 13" fill="none">
      <path d="M1.5 7L5 10.5L11.5 2.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-step-done" viewBox="0 0 27 28" fill="none">
      <circle cx="13.5" cy="14" r="12.5" stroke="currentColor" stroke-width="2"/>
      <path d="M8 14.5L12 18.5L19 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-phone-no" viewBox="0 0 20 28" fill="none">
      <rect x="1" y="1" width="18" height="26" rx="2" stroke="var(--color-ink)" stroke-width="1"/>
      <line x1="7" y1="25" x2="13" y2="25" stroke="var(--color-ink)" stroke-width="1" stroke-linecap="round"/>
      <line x1="7" y1="3" x2="13" y2="3" stroke="var(--color-ink)" stroke-width="1" stroke-linecap="round"/>
      <line x1="3" y1="3" x2="17" y2="25" stroke="var(--color-red)" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-phone" viewBox="0 0 18 32" fill="none">
      <rect x="1" y="1" width="16" height="30" rx="2" stroke="currentColor" stroke-width="1"/>
      <line x1="5" y1="28" x2="13" y2="28" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
      <line x1="5" y1="3" x2="13" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-cta-arrow" viewBox="0 0 24 24" fill="none">
      <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <nav class="navbar">
    <a href="#" class="navbar-brand">
      <img
        class="navbar-brand-img"
        src="assets/SOW-logo.svg"
        alt="SavingsMeter Logo"
      >
    </a>
    <button type="button" class="navbar-menu" id="menu-btn" aria-label="Open menu">
      <img class="navbar-menu-icon" src="assets/menu.svg" alt="">
    </button>
  </nav>

  <section class="hero">
    <h1 class="hero-title">
      Find your best<br><span class="hero-title-accent">phone savings</span>
    </h1>
    <ul class="hero-list">
      <li class="hero-item">
        <svg class="hero-item-icon" width="14" height="14" aria-hidden="true"><use href="#icon-hero-tick"/></svg>
        Answer 2 questions to unlock deals
      </li>
      <li class="hero-item">
        <svg class="hero-item-icon" width="14" height="14" aria-hidden="true"><use href="#icon-hero-tick"/></svg>
        We show the math — including plan fees
      </li>
      <li class="hero-item">
        <svg class="hero-item-icon" width="14" height="14" aria-hidden="true"><use href="#icon-hero-tick"/></svg>
        You see the total cost, no surprises
      </li>
    </ul>
  </section>

  <section class="calculator" id="calculator">

    <div class="calculator-grid">

      <div class="meter" id="meter">
        <svg viewBox="0 0 300 200" aria-label="Savings meter">
          <defs>
            <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%"   stop-color="var(--color-blue-light)"/>
              <stop offset="40%"  stop-color="var(--color-blue-mid)"/>
              <stop offset="100%" stop-color="var(--color-blue-dark)"/>
            </linearGradient>
          </defs>
          <path d="M 30,150 A 120,120 0 0,1 270,150"
            fill="none" stroke="var(--color-gray-200)" stroke-width="16" stroke-linecap="round"/>
          <path id="fillArc" d="M 30,150 A 120,120 0 0,1 270,150"
            fill="none" stroke="url(#arcGrad)" stroke-width="16" stroke-linecap="round"/>
          <circle cx="90"  cy="46" r="2.5" fill="var(--color-gray-300)"/>
          <circle cx="150" cy="30" r="2.5" fill="var(--color-gray-300)"/>
          <circle cx="210" cy="46" r="2.5" fill="var(--color-gray-300)"/>
          <text id="meterNum" x="150" y="148" text-anchor="middle" class="meter-num">$0</text>
          <text x="150" y="174" text-anchor="middle" class="meter-caption">total phone savings</text>
          <text x="30"  y="174" text-anchor="middle" class="meter-range">$0</text>
          <text x="270" y="174" text-anchor="middle" class="meter-range">$1,500</text>
        </svg>
      </div>
      <div class="step-stack">
        <section class="step" id="step-phone" aria-labelledby="step-phone-title">
          <div class="step-head">
            <div class="step-marker" id="phone-marker" aria-hidden="true">
              <span class="step-marker-num">1</span>
              <img src="assets/icon_step_done.svg" alt="" class="step-marker-check" width="27" height="28" aria-hidden="true">
        
            </div>
            <h3 class="step-title" id="step-phone-title">Pick your new phone</h3>
      
          </div>
          <label class="visually-hidden" for="phone-select">Select phone you want</label>
          <select class="phone-select" id="phone-select">
            <option value="" disabled selected>Select phone you want</option>
            <option value="iphone17pro" data-base="180" data-price="$1,099">Apple iPhone 17 Pro</option>
            <option value="iphone16promax"    data-base="140" data-price="$1,199">Apple iPhone 17 Pro Max</option>
            <option value="iphone17"    data-base="140" data-price="$799">Apple iPhone 17</option>
            <option value="iphone17e"    data-base="140" data-price="$599">Apple iPhone 17e</option>
            <option value="s26plus"    data-base="170" data-price="$999">Samsung Galaxy S26+</option>
            <option value="s26"         data-base="130" data-price="$799">Samsung Galaxy S26</option>
            <option value="s26ultra"      data-base="120" data-price="$1,299">Samsung Galaxy S26 Ultra</option>
          </select>
          <p class="phone-retail-price" id="phone-retail-price"></p>
        </section>

        <section class="step is-locked" id="step-trade" aria-labelledby="step-trade-title">
          <div class="step-head">
            <div class="step-marker" id="trade-marker" aria-hidden="true">
              <span class="step-marker-num">2</span>
              <img src="assets/icon_step_done.svg" alt="" class="step-marker-check" width="27" height="28" aria-hidden="true">
            </div>
            <h3 class="step-title" id="step-trade-title">Got a phone to trade in?</h3>
          </div>
          <div class="trade-in-content">
            <div class="trade-toggle-row">
              <span class="trade-toggle-label">Trade-In your current phone to boost savings</span>
              <button type="button" class="trade-toggle" id="trade-toggle" role="switch" aria-checked="true">
                <span class="trade-toggle-text">YES</span>
                <span class="trade-toggle-knob"></span>
              </button>
            </div>
            <label class="visually-hidden" for="trade-select">Select your trade-in phone age</label>
            <select class="phone-select" id="trade-select">
              <option value="" disabled selected>Select your trade-in</option>
              <option value="150">iPhone 13</option>
              <option value="400">iPhone 13 Pro</option>
              <option value="400">iPhone 16 Pro</option>
              <option value="400">iPhone 16 Pro Max</option>
              <option value="400">iPhone 15 Pro</option>
              <option value="400">iPhone 15</option>
              <option value="400">Samsung Galaxy S25+</option>
              <option value="400">Samsung Galaxy S25</option>
              <option value="400">Samsung Galaxy S26 Ultra</option>
            </select>
            <div class="meter-footer" style="min-height: 0;"><span class="meter-badge" id="meter-badge"><img src="assets/ico_savings.svg" alt="" aria-hidden="true" class="meter-badge-icon"><span id="meter-badge-text">Savings unlocked</span></span></div>
          </div>
        </section>

        <button type="button" class="cta" id="cta">
          Unlock My Deals
          <svg class="cta-icon" width="22" height="22" aria-hidden="true"><use href="#icon-cta-arrow"/></svg>
        </button>

      </div>
    </div>
  </section>

  <footer class="site-footer">
    <p>&copy; 2026 Save On Wireless</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
